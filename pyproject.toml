[project]
name = "houdini-mcp"
version = "0.1.0"
description = "An MCP server for SideFX Houdini."
authors = [
    { name = "Beat Reichenbach" }
]
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "python-semantic-release>=9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "ty>=0.0.82",
    "types-houdini>=21.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["houdini_mcp*", "houdini_mcp_protocol*", "houdini_mcp_plugin*"]

[tool.setuptools.package-data]
houdini_mcp = ["py.typed"]
houdini_mcp_protocol = ["py.typed"]
houdini_mcp_plugin = ["py.typed"]

[tool.semantic_release]
allow_zero_version = true
version_variables = [
    "src/houdini_mcp/__init__.py:__version__",
    "src/houdini_mcp_plugin/__init__.py:__version__",
]
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.ruff]
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["SIM108"]

[tool.ty.analysis]
replace-imports-with-any = ["hwebserver", "hdefereval"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_level = "INFO"
